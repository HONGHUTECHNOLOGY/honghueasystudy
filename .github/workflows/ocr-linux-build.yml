name: OCR Linux Build (x64/arm64)

# Linux OCR 二进制构建流水线（ddddocr + PyInstaller）
# 产物：ocr-linux-x64.zip / ocr-linux-arm64.zip（x64 ~229MB / arm64 ~157MB，
# 超过 git 单文件 100MB 限制，不入库）。
# 交付：双架构 zip 由 release job 自动上传至 GitHub Release（预发布 tag: ocr-linux，
# 永久有效）；desktop-build.yml 的 linux job 打包前 gh release download 拉取内嵌。
# Actions Artifact 仅作短期调试用途（14 天保留期），非交付通道。
# 运行时分发保持纯内置：安装包内嵌 ocr.zip，运行时零网络请求
# （详见 honghueasystudy_desktop/scripts/ocr-linux/README.md）
on:
  workflow_dispatch:
    inputs:
      # arm64 构建方式：native 使用 GitHub 原生 arm runner（公开仓库免费）；
      # qemu 在 x64 runner 上以 QEMU + arm64v8/ubuntu:20.04 容器模拟执行（较慢，作为无 arm 配额时的回退）
      arm64-mode:
        description: "arm64 构建方式（native / qemu）"
        required: false
        default: "native"
        type: choice
        options:
          - native
          - qemu

jobs:
  # Linux x64：ubuntu 原生 runner + Python 3.8
  build-x64:
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash

    steps:
      - name: Check out Git repository
        uses: actions/checkout@v4

      - name: Install Python 3.8
        uses: actions/setup-python@v5
        with:
          python-version: "3.8"

      - name: Build ocr-linux-x64
        run: python3 honghueasystudy_desktop/scripts/ocr-linux/build.py --output-dir build-x64

      - name: Upload artifact (ocr-linux-x64)
        uses: actions/upload-artifact@v4
        with:
          name: ocr-linux-x64.zip
          path: build-x64/ocr-linux-x64.zip
          if-no-files-found: error
          retention-days: 14

  # Linux arm64：原生 arm runner（ubuntu-24.04-arm）
  build-arm64-native:
    if: ${{ github.event.inputs.arm64-mode != 'qemu' }}
    runs-on: ubuntu-24.04-arm
    defaults:
      run:
        shell: bash

    steps:
      - name: Check out Git repository
        uses: actions/checkout@v4

      - name: Install Python 3.8
        uses: actions/setup-python@v5
        with:
          python-version: "3.8"

      - name: Build ocr-linux-arm64
        run: python3 honghueasystudy_desktop/scripts/ocr-linux/build.py --output-dir build-arm64

      - name: Upload artifact (ocr-linux-arm64)
        uses: actions/upload-artifact@v4
        with:
          name: ocr-linux-arm64.zip
          path: build-arm64/ocr-linux-arm64.zip
          if-no-files-found: error
          retention-days: 14

  # Linux arm64 回退：QEMU + arm64v8/ubuntu:20.04 容器（python3 即 3.8）
  build-arm64-qemu:
    if: ${{ github.event.inputs.arm64-mode == 'qemu' }}
    runs-on: ubuntu-latest

    steps:
      - name: Check out Git repository
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Build ocr-linux-arm64 (QEMU)
        run: |
          docker run --rm --platform linux/arm64 \
            -v "${{ github.workspace }}:/src" -w /src \
            arm64v8/ubuntu:20.04 bash -c "
              apt-get update &&
              apt-get install -y --no-install-recommends python3 python3-venv python3-pip zip ca-certificates &&
              python3 honghueasystudy_desktop/scripts/ocr-linux/build.py --output-dir build-arm64
            "

      - name: Upload artifact (ocr-linux-arm64)
        uses: actions/upload-artifact@v4
        with:
          name: ocr-linux-arm64.zip
          path: build-arm64/ocr-linux-arm64.zip
          if-no-files-found: error
          retention-days: 14

  # 双架构产物发布到 GitHub Release（预发布 tag: ocr-linux）
  # 产物超过 git 单文件 100MB 限制无法入库，Release 资产是 Linux 打包的唯一来源
  release:
    needs: [build-x64, build-arm64-native, build-arm64-qemu]
    if: ${{ !cancelled() && needs.build-x64.result == 'success' && (needs.build-arm64-native.result == 'success' || needs.build-arm64-qemu.result == 'success') }}
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: ocr-linux-*.zip
          merge-multiple: true
          path: dist

      # gh 在无 checkout 环境需 GH_REPO 定位仓库；release 已存在时 create 静默跳过，
      # upload --clobber 覆盖同名资产
      - name: "Upload to GitHub Release (tag: ocr-linux)"
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release create ocr-linux \
            --title "Linux OCR 资源包" \
            --prerelease \
            --notes "由 OCR Linux Build 自动产出（run: ${{ github.run_id }}）。双架构 PyInstaller 产物，供 desktop-build linux job 打包期内嵌，运行时纯内置零网络请求。" \
            || true
          gh release upload ocr-linux dist/ocr-linux-x64.zip dist/ocr-linux-arm64.zip --clobber
          gh release view ocr-linux --json assets --jq '.assets[] | "\(.name) \(.size) bytes"'
