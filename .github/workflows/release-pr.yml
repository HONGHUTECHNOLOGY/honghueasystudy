name: Release PR

# 仅手动触发：GitHub → Actions → Release PR → Run workflow
# 运行后 release-please 扫描 main 分支自上次发布以来的提交，
# 自动计算版本号（feat→minor / fix→patch / BREAKING→major）并创建/更新 Release PR
on:
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  release-pr:
    runs-on: ubuntu-latest
    steps:
      - uses: googleapis/release-please-action@v4
        id: release
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          default-branch: main # 明确对 main 分支维护 Release PR
          skip-github-release: true # 只创建 PR，不创建 Release
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

      # 「一键发版」：PR 创建后直接设置自动合并，检查通过即合入，
      # 合入触发 release-tag.yml 建 Release 并派发 desktop-build。
      # 仓库未开启 Allow auto-merge 或分支保护要求人工审批时这里只告警不失败，
      # 此时需要人到 Pull requests 页面手动点合并。
      - name: Auto-merge release PR
        if: ${{ steps.release.outputs.prs != '' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          PRS=$(echo '${{ steps.release.outputs.prs }}' | jq -r '.[].number' 2>/dev/null)
          if [ -z "$PRS" ]; then
            # 本次没有新建 PR（如上次运行已创建），兜底找 open 状态的 autorelease PR
            PRS=$(gh pr list --state open --label "autorelease: pending" --json number -q '.[].number')
          fi
          if [ -z "$PRS" ]; then
            echo "没有待处理的 Release PR"
            exit 0
          fi
          for pr in $PRS; do
            if gh pr merge "$pr" --auto --squash; then
              echo "PR #$pr 已设置自动合并"
            else
              echo "::warning::PR #$pr 无法设置自动合并 —— 需要在仓库 Settings 勾选 Allow auto-merge，且分支保护未要求人工审批；请到 Pull requests 手动合并"
            fi
          done
