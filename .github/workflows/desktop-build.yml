name: Desktop Build (win/mac/linux)

on:
  workflow_dispatch:
    # 发布链（上传 Release / GitCode 镜像 / 回写清单）仅在 tag 触发时执行；
    # 若发布步骤失败，修复后可从 main 手动 dispatch 并在 tag 里填版本号重跑发布链，
    # 不必重新构建（build 矩阵照常跑，产物一致）。
    inputs:
      tag:
        description: "发布目标 tag（如 v5.2.0），留空则只在 tag 触发时发布"
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: desktop-build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # 浏览器扩展：构建内置扩展并打包 extension.zip。
  # 由 release-tag.yml 在 Release 创建后随桌面端矩阵一并自动触发；
  # 产物与桌面安装包一起上传到同一 GitHub Release。
  build-extension:
    runs-on: ubuntu-latest
    # 扩展与桌面端/用户脚本版本线各自独立（扩展版本源 = 根 package.json，
    # 构建时 syncManifestVersion 注入 extension/manifest.json），
    # 把构建产物的实际版本传给 upload-release 用于下载列表标注
    outputs:
      ext_version: ${{ steps.ext_version.outputs.version }}
    steps:
      - name: Check out Git repository
        uses: actions/checkout@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22.14"

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Cache pnpm store
        uses: actions/cache@v4
        with:
          path: |
            ~/.local/share/pnpm/store
            ~/AppData/Local/pnpm/store
            ~/Library/pnpm/store
          key: ${{ runner.os }}-pnpm-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Build extension
        run: pnpm build:ext

      # scripts/pack-extension.js：zip 根目录直接是 manifest.json / background.js /
      # content / lib / icon / _locales，解压即可「加载已解压的扩展程序」
      - name: Pack extension.zip
        run: pnpm pack:ext

      - name: Upload extension.zip artifact
        uses: actions/upload-artifact@v4
        with:
          name: extension-zip
          path: extension/extension.zip
          if-no-files-found: error
          retention-days: 7

      - name: Read extension version
        id: ext_version
        run: echo "version=$(node -p "require('./extension/manifest.json').version")" >> "$GITHUB_OUTPUT"

  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          # Windows x64
          - os: windows-latest
            platform: win
            arch: x64

          # macOS ARM64（Apple Silicon 原生）
          - os: macos-latest
            platform: mac
            arch: arm64

          # macOS x64（Intel）：GitHub 已无 Intel runner，在 arm64 机器上交叉编译
          - os: macos-latest
            platform: mac
            arch: x64

          # Linux x64
          - os: ubuntu-latest
            platform: linux
            arch: x64

          # Linux ARM64（原生 arm64 runner；QEMU 下全量桌面打包过慢，不设仿真回退。
          # 不内置 Chrome：CfT 自 153 起才提供 linux-arm64 包，与内置浏览器锁定的 137
          # 版本策略冲突，chrome.install.js 会跳过下载/打包并保留空目录；
          # 仅产出 AppImage：deb/rpm 依赖的 fpm 工具无 arm64 预编译包（x86 二进制
          # Exec format error），build-app.js 对 linux-arm64 限定 --linux AppImage；
          # OCR 资源由下方「Fetch Linux OCR bundle」步骤从 GitHub Release
          # （tag: ocr-linux，由 ocr-linux-build.yml 维护）拉取，Release 缺失时该步骤报错）
          - os: ubuntu-24.04-arm
            platform: linux
            arch: arm64

    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash

    steps:
      - name: Check out Git repository
        uses: actions/checkout@v4

      # Linux OCR 纯内置：资源包超 git 单文件 100MB 限制不入库，
      # 从 GitHub Release（ocr-linux-build.yml 维护的预发布 tag: ocr-linux）拉取对应架构 zip。
      # Release 缺失时此处快速失败（提示先触发 OCR Linux Build），避免装完依赖才被守卫拦截。
      # gh 在 checkout 后无需 GH_REPO；下载的 zip 即 ocr.zip 内容（ocr 二进制位于 zip 根）
      - name: Fetch Linux OCR bundle
        if: matrix.platform == 'linux'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download ocr-linux --pattern "ocr-linux-${{ matrix.arch }}.zip" --dir /tmp/ocr
          mkdir -p honghueasystudy_desktop/bin/ocr/linux-${{ matrix.arch }}
          mv /tmp/ocr/ocr-linux-${{ matrix.arch }}.zip honghueasystudy_desktop/bin/ocr/linux-${{ matrix.arch }}/ocr.zip
          ls -lh honghueasystudy_desktop/bin/ocr/linux-${{ matrix.arch }}/

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22.14"

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Cache pnpm store
        uses: actions/cache@v4
        with:
          path: |
            ~/.local/share/pnpm/store
            ~/AppData/Local/pnpm/store
            ~/Library/pnpm/store
          key: ${{ runner.os }}-pnpm-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-

      # 桌面端打包前需要先构建仓库根的内置扩展（extension/）
      - name: Install root dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Build extension
        run: pnpm build:ext

      - name: Install desktop dependencies
        run: pnpm -C honghueasystudy_desktop install --frozen-lockfile

      # 直连 gulp 流水线（tsc → build-app），不走 pnpm build 的 lint 前置门：
      # 仓库既有 lint 债（default-langs.ts 超长行、bookmarks.vue no-void 等处）
      # 使 eslint --fix 必然失败，且 prettier --write 会改写无关文件。
      # 本步骤与本地已验证的打包路径完全一致。
      - name: Build desktop app
        run: |
          pnpm -C honghueasystudy_desktop exec gulp -f ./scripts/tsc.js
          pnpm -C honghueasystudy_desktop exec gulp -f ./scripts/build-app.js
        env:
          USE_HARD_LINKS: false
          PLATFORM: ${{ matrix.platform }}
          ARCH: ${{ matrix.arch }}

      # 旧版兼容包：resources/app 的全量 zip。
      # 新版客户端（>=3.2.1）已改为下载安装包（dist/*.exe）静默覆盖安装 —— 只换 app 目录
      # 无法更新 Electron 运行时、内置扩展 resources/extension、bin/chrome 等 app 之外的内容。
      # 这个 zip 仅用于让 <=3.2.0 的已装用户还能升级上来，等其淘汰后可删。
      - name: Pack legacy in-place update bundle (Windows only)
        if: matrix.platform == 'win'
        run: node scripts/pack-app-update.js

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ matrix.platform }}-${{ matrix.arch }}
          path: |
            honghueasystudy_desktop/packages/app/dist/*.exe
            honghueasystudy_desktop/packages/app/dist/*.dmg
            honghueasystudy_desktop/packages/app/dist/*.AppImage
            honghueasystudy_desktop/packages/app/dist/*.deb
            honghueasystudy_desktop/packages/app/dist/*.rpm
            honghueasystudy_desktop/packages/app/dist/update/app-*.zip
            honghueasystudy_desktop/packages/app/dist/update/app-*.zip.sha256
            honghueasystudy_desktop/packages/app/dist/update/update-meta.json
          if-no-files-found: error
          retention-days: 7

  # Release 发布：仅当以 tag 为 ref 触发时执行（release-tag.yml 在 Release 创建后
  # 自动派发，或手动 dispatch 时填 tag）。把桌面端全部平台产物与 extension.zip
  # 上传到该 tag 对应的 GitHub Release，并追加「桌面端与扩展下载」说明段落。
  upload-release:
    needs: [build, build-extension]
    if: startsWith(github.ref, 'refs/tags/') || inputs.tag != ''
    runs-on: ubuntu-latest
    # 提到 job 级，step 的 if 才能读到（step 级 env 不参与 if 求值）
    env:
      GITCODE_TOKEN: ${{ secrets.GITCODE_TOKEN }}

    steps:
      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      # upload-artifact 保留 dist/ 目录结构：安装包在根、更新包与 update-meta.json
      # 在 update/ 子目录。统一拍平，后面的 gh release upload / 下载链接生成 /
      # GitCode 同步 / 清单脚本的全局匹配才能命中，也避免目录被当成附件上传。
      - name: Flatten artifact directories
        run: |
          find artifacts -mindepth 2 -type f -exec mv {} artifacts/ \;
          ls -lh artifacts/

      - name: Upload artifacts to GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          TAG_NAME=${{ inputs.tag || github.ref_name }}
          TAG_NAME=${TAG_NAME#refs/tags/}
          echo "Uploading artifacts to release: $TAG_NAME"
          # 已有正式 Release（release-please 创建）就不建草稿，避免残留 untagged 草稿；
          # 手动对 tag dispatch 且无 Release 时才补建草稿
          gh release view "$TAG_NAME" >/dev/null 2>&1 || gh release create "$TAG_NAME" --draft --generate-notes
          # 只传文件：用 find 兜底，目录永远不会被当成附件
          find artifacts -type f -print0 | xargs -0 gh release upload "$TAG_NAME" --clobber

      - name: Append desktop & extension release notes
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          TAG_NAME=${{ inputs.tag || github.ref_name }}
          TAG_NAME=${TAG_NAME#refs/tags/}
          DL="https://github.com/${GH_REPO}/releases/download/${TAG_NAME}"

          NOTES_FILE=/tmp/desktop-notes.md
          EXT_VERSION="${{ needs.build-extension.outputs.ext_version }}"
          {
            echo ''
            echo '---'
            echo ''
            echo '## 🖥️ 桌面端与浏览器扩展下载'
            echo ''
            echo "> 桌面端、浏览器扩展与用户脚本版本线相互独立，各自按自身版本号发布。"
            echo ''
            for f in artifacts/*; do
              name=$(basename "$f")
              case "$name" in
                *.exe)         label="Windows 64位安装包（不支持 Win7）" ;;
                *.dmg)         label="macOS 镜像" ;;
                *.AppImage)    label="Linux AppImage" ;;
                *.deb)         label="Linux deb 包" ;;
                *.rpm)         label="Linux rpm 包" ;;
                extension.zip) label="浏览器扩展 v${EXT_VERSION}（解压后在扩展管理页加载）" ;;
                app-*.zip)     label="Windows 就地更新包（客户端自动更新下载，无需手动安装）" ;;
                *.zip.sha256)  label="更新包校验值" ;;
                *)             label="$name" ;;
              esac
              echo "- [${label}](${DL}/${name})"
            done
            echo ''
            echo '### 🔗 快捷访问'
            echo '- [官网](https://honghueasystudy.honghutech.eu.org/)'
            echo '- [官网软件下载（更快）](https://honghueasystudy.honghutech.eu.org/docs/app)'
          } > "$NOTES_FILE"

          EXISTING_BODY=$(gh release view "$TAG_NAME" --json body -q .body 2>/dev/null || echo "")
          # 幂等：先剥离本段落旧内容再追加，避免重复触发时说明叠加
          CLEANED_BODY=$(printf '%s\n' "$EXISTING_BODY" | awk '/<!-- DESKTOP-RELEASE-NOTES-START -->/{skip=1} /<!-- DESKTOP-RELEASE-NOTES-END -->/{skip=0; next} !skip')
          {
            printf '%s\n' "$CLEANED_BODY"
            echo '<!-- DESKTOP-RELEASE-NOTES-START -->'
            cat "$NOTES_FILE"
            echo '<!-- DESKTOP-RELEASE-NOTES-END -->'
          } > /tmp/final-body.md
          gh release edit "$TAG_NAME" --notes-file /tmp/final-body.md

      # GitCode 镜像：国内直连 GitHub Release 常被限速或 DNS 污染，客户端清单把
      # GitCode 放 urls[0]、GitHub 作兜底，因此两个源的包必须字节一致——这里复用
      # 同一批 artifacts，不重新打包。
      #
      # 必须「全部」同步：installers.win32/darwin/linux 的 urls[0] 都是 GitCode，
      # 少传任何一个，对应平台的用户每次更新都要先吃一次 404/超时才回退 GitHub，
      # 镜像等于没用。GitCode 官方限制 Release 单附件 ≤ 2GB、总容量不限，324MB 安装包可传。
      # 未配置 GITCODE_TOKEN 时整步跳过（GitHub 发布不受影响）；配置了就严格校验，
      # 失败即红，避免清单指向一个不存在的镜像附件。
      - name: Publish artifacts to GitCode
        if: env.GITCODE_TOKEN != ''
        run: |
          TAG_NAME=${{ inputs.tag || github.ref_name }}
          TAG_NAME=${TAG_NAME#refs/tags/}
          ls -lh artifacts/
          FILES=()
          # 安装包排在最前：它们才是客户端真正下载的文件，上传失败要尽早暴露，
          # 而不是先花时间传完扩展和旧版 zip 才发现 300MB 的包传不上去。
          for f in artifacts/*.exe artifacts/*.dmg artifacts/*.AppImage artifacts/*.deb artifacts/*.rpm \
                   artifacts/app-*.zip artifacts/*.zip.sha256 artifacts/extension.zip; do
            if [ -f "$f" ]; then FILES+=(--file "$f"); fi
          done
          if [ ${#FILES[@]} -eq 0 ]; then
            echo "没有可同步的附件（安装包 / 更新包 / 扩展均缺失）"
            exit 1
          fi
          node scripts/publish-to-gitcode.js \
            --tag "$TAG_NAME" \
            --name "$TAG_NAME" \
            --notes-file /tmp/final-body.md \
            --require-token \
            "${FILES[@]}"

  # 更新清单自动回写：把本次版本的 versions[] 条目写进 website/api/honghu-app-infos.json
  # 并直接提交推回 main —— CF Pages 检测到 push 自动重建，客户端随即检测到更新。
  # 免去「本地跑脚本 + 手动提交」这一步，实现点一下 Action 即完成发版。
  #
  # 必须排在 upload-release 之后：--verify 默认对 GitCode + GitHub 的每个附件做
  # Range GET 探链（fail-closed），附件没传完就会拒绝写入 —— 正好兜住镜像缺包的情况。
  # GITCODE_TOKEN 未配置时 GitCode 步骤被跳过，这里会因 GitCode 链接 404 而失败，
  # 属预期行为：请先在仓库 Secrets 配置 GITCODE_TOKEN。
  update-manifest:
    needs: [upload-release]
    if: startsWith(github.ref, 'refs/tags/') || inputs.tag != ''
    runs-on: ubuntu-latest
    steps:
      # 清单要提交到 main 才会被 CF 发布，所以这里检出 main 而不是 tag
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22.14"

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      # 同 upload-release：拍平 update/ 子目录，update-meta.json 落到 artifacts/ 根
      - name: Flatten artifact directories
        run: find artifacts -mindepth 2 -type f -exec mv {} artifacts/ \;

      # write-update-manifest 的探链通过 createRequire 从桌面端 app 包解析 axios；
      # 本 job 不装 workspace 依赖，在仓库根补装一份（模块解析会向上找到它）
      - name: Install axios for link probing
        run: npm install --no-save "axios@^0.25.0"

      - name: Write update manifest
        env:
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          node scripts/write-update-manifest.js \
            --meta artifacts/update-meta.json \
            --artifacts artifacts \
            --tag "$RELEASE_TAG" \
            --notes "other: 桌面端与扩展同步更新，详见发布页" \
            --verify

      - name: Commit manifest to main
        env:
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add website/api/
          if git diff --cached --quiet; then
            echo "清单无变化（重复触发或版本已存在），跳过提交"
            exit 0
          fi
          git commit -m "chore(release): 同步 ${RELEASE_TAG} 更新清单"
          # GITHUB_TOKEN 的 push 不会触发其他 workflow（无循环风险）；
          # 若 main 有分支保护，这里会失败 —— 需允许 GITHUB_TOKEN 推送或改用 PAT
          git push origin HEAD:main
