name: Desktop Build (win/mac/linux)

on:
  workflow_dispatch:
    # 发布链（上传 GitHub Release / GitCode 镜像 / 回写清单）仅在 tag 触发时执行；
    # 若发布步骤失败，修复后可从 main 手动 dispatch 并在 tag 里填版本号重跑发布链，
    # 不必重新构建（build 矩阵照常跑，产物一致）。
    # GitCode 镜像与清单回写已拆到独立链路：
    #   - GitCode 发布：.gitcode/workflows/release-publish.yml（GitCode 原生 Action，国内 runner）
    #   - 清单回写：update-manifest.yml（由 GitCode 发布完成后自动派发，或手动触发）
    inputs:
      tag:
        description: "发布目标 tag（如 v5.2.0），留空则只在 tag 触发时发布"
        required: false
        default: ""
      skip_build:
        description: "复用已有产物、跳过三平台构建（发布步骤失败后重跑用，需填 artifact_run_id）"
        type: boolean
        default: false
      artifact_run_id:
        description: "要复用产物的 run id（skip_build 勾选时必填）"
        required: false
        default: ""

permissions:
  contents: write
  # skip_build 时要用 download-artifact 的 run-id 跨 run 取产物，需要读 Actions
  actions: read

concurrency:
  group: desktop-build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # 浏览器扩展：构建内置扩展并打包 extension.zip。
  # 由 release-tag.yml 在 Release 创建后随桌面端矩阵一并自动触发；
  # 产物与桌面安装包一起上传到同一 GitHub Release。
  build-extension:
    runs-on: ubuntu-latest
    # skip_build 用于发布步骤失败后只重跑发布链（产物从指定 run 复用）
    if: ${{ !inputs.skip_build }}
    # 扩展与桌面端/用户脚本版本线各自独立（扩展版本源 = 根 package.json，
    # 构建时 syncManifestVersion 注入 extension/manifest.json），
    # 把构建产物的实际版本传给 upload-release 用于下载列表标注
    outputs:
      ext_version: ${{ steps.ext_version.outputs.version }}
    steps:
      - name: Check out Git repository
        uses: actions/checkout@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22.14"

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Cache pnpm store
        uses: actions/cache@v4
        with:
          path: |
            ~/.local/share/pnpm/store
            ~/AppData/Local/pnpm/store
            ~/Library/pnpm/store
          key: ${{ runner.os }}-pnpm-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Build extension
        run: pnpm build:ext

      # scripts/pack-extension.js：zip 根目录直接是 manifest.json / background.js /
      # content / lib / icon / _locales，解压即可「加载已解压的扩展程序」
      - name: Pack extension.zip
        run: pnpm pack:ext

      - name: Upload extension.zip artifact
        uses: actions/upload-artifact@v4
        with:
          name: extension-zip
          path: extension/extension.zip
          if-no-files-found: error
          retention-days: 7

      - name: Read extension version
        id: ext_version
        run: echo "version=$(node -p "require('./extension/manifest.json').version")" >> "$GITHUB_OUTPUT"

  build:
    if: ${{ !inputs.skip_build }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Windows x64
          - os: windows-latest
            platform: win
            arch: x64

          # macOS ARM64（Apple Silicon 原生）
          - os: macos-latest
            platform: mac
            arch: arm64

          # macOS x64（Intel）：GitHub 已无 Intel runner，在 arm64 机器上交叉编译
          - os: macos-latest
            platform: mac
            arch: x64

          # Linux x64
          - os: ubuntu-latest
            platform: linux
            arch: x64

          # Linux ARM64（原生 arm64 runner；QEMU 下全量桌面打包过慢，不设仿真回退。
          # 不内置 Chrome：CfT 自 153 起才提供 linux-arm64 包，与内置浏览器锁定的 137
          # 版本策略冲突，chrome.install.js 会跳过下载/打包并保留空目录；
          # 仅产出 AppImage：deb/rpm 依赖的 fpm 工具无 arm64 预编译包（x86 二进制
          # Exec format error），build-app.js 对 linux-arm64 限定 --linux AppImage；
          # OCR 资源由下方「Fetch Linux OCR bundle」步骤从 GitHub Release
          # （tag: ocr-linux，由 ocr-linux-build.yml 维护）拉取，Release 缺失时该步骤报错）
          - os: ubuntu-24.04-arm
            platform: linux
            arch: arm64

    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash

    steps:
      - name: Check out Git repository
        uses: actions/checkout@v4

      # Linux OCR 纯内置：资源包超 git 单文件 100MB 限制不入库，
      # 从 GitHub Release（ocr-linux-build.yml 维护的预发布 tag: ocr-linux）拉取对应架构 zip。
      # Release 缺失时此处快速失败（提示先触发 OCR Linux Build），避免装完依赖才被守卫拦截。
      # gh 在 checkout 后无需 GH_REPO；下载的 zip 即 ocr.zip 内容（ocr 二进制位于 zip 根）
      - name: Fetch Linux OCR bundle
        if: matrix.platform == 'linux'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download ocr-linux --pattern "ocr-linux-${{ matrix.arch }}.zip" --dir /tmp/ocr
          mkdir -p honghueasystudy_desktop/bin/ocr/linux-${{ matrix.arch }}
          mv /tmp/ocr/ocr-linux-${{ matrix.arch }}.zip honghueasystudy_desktop/bin/ocr/linux-${{ matrix.arch }}/ocr.zip
          ls -lh honghueasystudy_desktop/bin/ocr/linux-${{ matrix.arch }}/

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22.14"

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Cache pnpm store
        uses: actions/cache@v4
        with:
          path: |
            ~/.local/share/pnpm/store
            ~/AppData/Local/pnpm/store
            ~/Library/pnpm/store
          key: ${{ runner.os }}-pnpm-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-

      # 桌面端打包前需要先构建仓库根的内置扩展（extension/）
      - name: Install root dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Build extension
        run: pnpm build:ext

      - name: Install desktop dependencies
        run: pnpm -C honghueasystudy_desktop install --frozen-lockfile

      # 直连 gulp 流水线（tsc → build-app），不走 pnpm build 的 lint 前置门：
      # 仓库既有 lint 债（default-langs.ts 超长行、bookmarks.vue no-void 等处）
      # 使 eslint --fix 必然失败，且 prettier --write 会改写无关文件。
      # 本步骤与本地已验证的打包路径完全一致。
      - name: Build desktop app
        run: |
          pnpm -C honghueasystudy_desktop exec gulp -f ./scripts/tsc.js
          if [ "${{ matrix.platform }}" != "mac" ]; then
            pnpm -C honghueasystudy_desktop exec gulp -f ./scripts/build-app.js
            exit 0
          fi
          # macOS 上 DMG 打包偶发 `hdiutil detach -force: Resource busy`：
          # electron-builder 用 Finder/AppleScript 摆图标，Spotlight 又会索引新挂载的卷，
          # 两者都可能让卷在卸载时仍被占用。做法：先关索引，失败则清理挂载卷后重试。
          sudo mdutil -a -i off || true
          for attempt in 1 2 3; do
            echo "::group::mac 打包第 ${attempt} 次尝试"
            if pnpm -C honghueasystudy_desktop exec gulp -f ./scripts/build-app.js; then
              echo "::endgroup::"
              exit 0
            fi
            echo "::endgroup::"
            echo "::warning::mac 第 ${attempt} 次打包失败（多为 DMG 卸载被占用），清理后重试"
            # 只清理本项目挂载的卷，绝不能碰系统盘
            for v in /Volumes/鸿鹄*; do
              [ -d "$v" ] && hdiutil detach -force "$v" || true
            done
            killall Finder 2>/dev/null || true
            rm -rf honghueasystudy_desktop/packages/app/dist/mac \
                   honghueasystudy_desktop/packages/app/dist/*.dmg || true
            sleep 3
          done
          echo "::error::mac 打包连续 3 次失败，请查看上方 hdiutil 报错"
          exit 1
        env:
          USE_HARD_LINKS: false
          PLATFORM: ${{ matrix.platform }}
          ARCH: ${{ matrix.arch }}

      # 旧版兼容包：resources/app 的全量 zip。
      # 新版客户端（>=3.2.1）已改为下载安装包（dist/*.exe）静默覆盖安装 —— 只换 app 目录
      # 无法更新 Electron 运行时、内置扩展 resources/extension、bin/chrome 等 app 之外的内容。
      # 这个 zip 仅用于让 <=3.2.0 的已装用户还能升级上来，等其淘汰后可删。
      - name: Pack legacy in-place update bundle (Windows only)
        if: matrix.platform == 'win'
        run: node scripts/pack-app-update.js

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ matrix.platform }}-${{ matrix.arch }}
          path: |
            honghueasystudy_desktop/packages/app/dist/*.exe
            honghueasystudy_desktop/packages/app/dist/*.dmg
            honghueasystudy_desktop/packages/app/dist/*.AppImage
            honghueasystudy_desktop/packages/app/dist/*.deb
            honghueasystudy_desktop/packages/app/dist/*.rpm
            honghueasystudy_desktop/packages/app/dist/update/app-*.zip
            honghueasystudy_desktop/packages/app/dist/update/app-*.zip.sha256
            honghueasystudy_desktop/packages/app/dist/update/update-meta.json
          if-no-files-found: error
          retention-days: 7

  # Release 发布：仅当以 tag 为 ref 触发时执行（release-tag.yml 在 Release 创建后
  # 自动派发，或手动 dispatch 时填 tag）。把桌面端全部平台产物与 extension.zip
  # 上传到该 tag 对应的 GitHub Release，并追加「桌面端与扩展下载」说明段落。
  # 同时上传 assets-manifest.json（附件清单+sha256）与 release-notes.md：
  # GitCode 原生工作流（release-publish.yml）不访问 api.github.com，靠这两个
  # 固定文件名的附件完成「下载清单 + 复用 Release 说明」。
  upload-release:
    needs: [build, build-extension]
    # always()：skip_build 时 build/build-extension 被跳过，默认语义会把本 job 一起跳过
    if: ${{ always() && (startsWith(github.ref, 'refs/tags/') || inputs.tag != '') && needs.build.result != 'failure' && needs.build-extension.result != 'failure' }}
    runs-on: ubuntu-latest

    steps:
      # 检出仓库提供 git/gh 上下文（gh release 系列命令依赖仓库定位）
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag && 'main' || github.ref }}
          sparse-checkout: |
            README.md
          sparse-checkout-cone-mode: false

      - name: Download all build artifacts
        if: ${{ !inputs.skip_build }}
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      # 复用历史 run 的产物（保留 7 天）：发布步骤失败重跑时不必再等三平台构建
      - name: Download artifacts from previous run
        if: ${{ inputs.skip_build }}
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
          run-id: ${{ inputs.artifact_run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      # upload-artifact 保留 dist/ 目录结构：安装包在根、更新包与 update-meta.json
      # 在 update/ 子目录。统一拍平，后面的 gh release upload / 下载链接生成 /
      # GitCode 同步 / 清单脚本的全局匹配才能命中，也避免目录被当成附件上传。
      - name: Flatten artifact directories
        run: |
          find artifacts -mindepth 2 -type f -exec mv {} artifacts/ \;
          # 搬空后残留的空目录会让「遍历 artifacts/*」把它当成附件
          find artifacts -mindepth 1 -type d -empty -delete
          # 安装包统一用 ASCII 前缀：中文「鸿鹄易学-」在 GitCode 附件列表/OBS 对象名
          # 里可能被吞掉或转码异常，且对用户无意义；清单脚本按 -setup-os-arch 解析，
          # 前缀无关，改名安全。
          for f in artifacts/鸿鹄易学-*; do
            [ -f "$f" ] || continue
            base=$(basename "$f")
            mv "$f" "artifacts/honghueasystudy-${base#鸿鹄易学-}"
          done
          ls -lh artifacts/

      - name: Upload artifacts to GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          TAG_NAME=${{ inputs.tag || github.ref_name }}
          TAG_NAME=${TAG_NAME#refs/tags/}
          echo "Uploading artifacts to release: $TAG_NAME"
          # 已有正式 Release（release-please 创建）就不建草稿，避免残留 untagged 草稿；
          # 手动对 tag dispatch 且无 Release 时才补建草稿
          gh release view "$TAG_NAME" >/dev/null 2>&1 || gh release create "$TAG_NAME" --draft --generate-notes
          # 清掉历史命名残留（如 鸿鹄易学-* 上传后变成 -5.2.0-*）：
          # --clobber 只覆盖同名，不删旧名，不清理会出现新旧两套安装包并存。
          # 必须按 id 删：旧附件名以 - 开头（中文前缀被 GitHub 剥掉），
          # gh 按名字删会把 -5.2.0-... 当成 flag 解析。
          gh release view "$TAG_NAME" --json assets \
            -q '.assets[] | "\(.id)\t\(.name)"' 2>/dev/null | while IFS=$'\t' read -r aid aname; do
            if [ ! -f "artifacts/$aname" ]; then
              echo "删除过期附件: $aname (id=$aid)"
              gh api -X DELETE "repos/${GH_REPO}/releases/assets/$aid" || true
            fi
          done
          # 只传文件：用 find 兜底，目录永远不会被当成附件
          find artifacts -type f -print0 | xargs -0 gh release upload "$TAG_NAME" --clobber

      # Release 说明只保留「更新日志 + 使用方法」：release-please 写的更新日志保留在正文，
      # 这里追加固定段落。不再自动生成下载链接清单与官网快捷访问
      # （Assets 里本来就有全部附件，罗列一遍只会让说明冗长）。
      - name: Append usage notes to release body
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          TAG_NAME=${{ inputs.tag || github.ref_name }}
          TAG_NAME=${TAG_NAME#refs/tags/}

          NOTES_FILE=/tmp/usage-notes.md
          cat > "$NOTES_FILE" <<'NOTES'

          ---

          ## 📦 使用方法

          **方法一**：使用 Edge 浏览器可直接访问扩展商店下载：[鸿鹄易学 Edge 扩展链接](https://microsoftedge.microsoft.com/addons/detail/%E9%B8%BF%E9%B9%A4%E6%98%93%E5%AD%A6/ocidllankdjkcieeefhgmgnkppcbdfhh)（更新可能不及时）

          **方法二**：解压 `extension.zip` 后，在 Chrome/Edge 浏览器中打开扩展页面，开启开发者模式，点击加载已解压缩的扩展，选择解压后文件所在的文件夹即可添加扩展。

          **方法三**：下载系统对应桌面端安装包，安装后在桌面端创建浏览器，浏览器会自动注入扩展，并且桌面端支持辅助操控（适用于智慧树及中国大学 MOOC）。
          NOTES

          EXISTING_BODY=$(gh release view "$TAG_NAME" --json body -q .body 2>/dev/null || echo "")
          # 幂等：先剥离本段落旧内容再追加，避免重复触发时说明叠加
          CLEANED_BODY=$(printf '%s\n' "$EXISTING_BODY" | awk '/<!-- DESKTOP-RELEASE-NOTES-START -->/{skip=1} /<!-- DESKTOP-RELEASE-NOTES-END -->/{skip=0; next} !skip')
          {
            printf '%s\n' "$CLEANED_BODY"
            echo '<!-- DESKTOP-RELEASE-NOTES-START -->'
            cat "$NOTES_FILE"
            echo '<!-- DESKTOP-RELEASE-NOTES-END -->'
          } > /tmp/final-body.md
          gh release edit "$TAG_NAME" --notes-file /tmp/final-body.md
          # GitCode 工作流会原样复用这份正文创建/更新 GitCode Release
          cp /tmp/final-body.md artifacts/release-notes.md

      # 附件清单（文件名 + 大小 + sha256）：GitCode 工作流下载附件时只依赖
      # 可镜像的 releases/download 直链，不访问 api.github.com；清单里的
      # size/sha256 用来拦截镜像返回的 200+HTML 错误页
      - name: Generate assets manifest
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        working-directory: artifacts
        run: |
          TAG_NAME="${{ inputs.tag || github.ref_name }}"
          TAG_NAME="${TAG_NAME#refs/tags/}"
          node -e '
            const fs = require("fs"), crypto = require("crypto");
            const tag = process.argv[1];
            const files = fs.readdirSync(".")
              .filter((f) => fs.statSync(f).isFile() && f !== "assets-manifest.json")
              .sort()
              .map((f) => ({
                name: f,
                size: fs.statSync(f).size,
                sha256: crypto.createHash("sha256").update(fs.readFileSync(f)).digest("hex")
              }));
            fs.writeFileSync("assets-manifest.json", JSON.stringify({
              tag,
              generated_at: new Date().toISOString(),
              files
            }, null, 2));
            console.log("清单包含", files.length, "个附件");
          ' "$TAG_NAME"
          # 清单与说明正文一并上 Release：GitCode 侧靠固定文件名拉取
          gh release upload "$TAG_NAME" assets-manifest.json release-notes.md --clobber
          ls -lh

  # 更新清单回写已拆分到 update-manifest.yml：
  # GitCode 附件由 .gitcode/workflows/release-publish.yml（国内 runner）上传，
  # 完成后自动派发 update-manifest.yml —— 此时 GitCode 链接可达，
  # write-update-manifest 的 Range GET 探链（fail-closed）才能全绿通过。
  # GitCode 工作流未配置 GITHUB_PAT 时，需在 GitHub Actions 手动触发
  # update-manifest.yml 并填 tag。
