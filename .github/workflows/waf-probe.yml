name: WAF Probe

# 一次性诊断工作流：判定 GitCode 文件网关（file.gitcode.com）对 CI（海外 IP）
# 返回 502 的判别条件——「纯来源 IP」还是「IP + 非浏览器 UA 组合」。
# 对照本地实验（国内 IP + 非浏览器 UA = 200），本探针在海外 IP 下分别用
# 无 UA 与浏览器 UA 各直传一次，结果即可定性。定性后本工作流可删除。

on:
  workflow_dispatch: {}

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Probe file.gitcode.com
        env:
          GITCODE_TOKEN: ${{ secrets.GITCODE_TOKEN }}
        run: |
          node -e '
          const https = require("https");
          const token = process.env.GITCODE_TOKEN;
          const UA = "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/126.0.0.0 Safari/537.36";
          function req(opts, body) {
            return new Promise((res, rej) => {
              const r = https.request(opts, (x) => {
                let b = "";
                x.on("data", (c) => (b += c));
                x.on("end", () => res({ code: x.statusCode, body: b }));
              });
              r.on("error", rej);
              r.setTimeout(120000, () => r.destroy(new Error("probe timeout")));
              if (body) r.end(body); else r.end();
            });
          }
          async function getUploadUrl(fileName) {
            const u = await req({
              host: "api.gitcode.com",
              path: "/api/v5/repos/honghutech/honghueasystudy/releases/v5.2.0/upload_url?file_name=" + fileName,
              headers: { "PRIVATE-TOKEN": token, "User-Agent": UA }
            });
            if (u.code !== 200) throw new Error("upload_url HTTP " + u.code + " " + u.body.slice(0, 200));
            return JSON.parse(u.body);
          }
          async function put(presigned, ua) {
            const U = new URL(presigned.url);
            const body = Buffer.alloc(1024, 0x61);
            const headers = Object.assign({}, presigned.headers || {}, { "Content-Length": body.length });
            if (ua) headers["User-Agent"] = ua;
            const p = await req({ host: U.host, path: U.pathname + U.search, method: "PUT", headers }, body);
            return p;
          }
          (async () => {
            console.log("== 实验 1：海外 IP + 无 UA");
            try {
              const p1 = await put(await getUploadUrl("waf-probe-noua.txt"), null);
              console.log("PUT 结果:", p1.code, p1.body.slice(0, 120));
            } catch (e) { console.log("失败:", e.message); }
            console.log("== 实验 2：海外 IP + 浏览器 UA");
            try {
              const p2 = await put(await getUploadUrl("waf-probe-ua.txt"), UA);
              console.log("PUT 结果:", p2.code, p2.body.slice(0, 120));
            } catch (e) { console.log("失败:", e.message); }
          })().catch((e) => { console.error("probe error:", e.message); process.exit(1); });
          '
