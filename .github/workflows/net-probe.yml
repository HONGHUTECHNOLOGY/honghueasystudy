name: Net Probe (GitCode upload speed)

# 一次性网络探测：量出 GitHub runner 上传 GitCode OBS 的真实单流速率。
#
# 为什么需要它：publish-gitcode 在 GitHub CI 上一直跑不完（2.6GB 传 1.5 小时后失败），
# 但「慢」到底是线路问题还是 OBS 限速、WARP 能不能救，一直没有数字。
# 本 workflow 只做对照实验，不参与发版，失败也不影响任何东西。
#
# 用法（手动触发）：
#   gh workflow run net-probe.yml -f size_mb=40
# 结果看每个 job 的日志末尾「上传耗时 / 平均 KB/s」，以及 Step Summary。
#
# 副作用：会在 GitCode 建 net-probe-direct / net-probe-warp 两个 tag，
# 各挂一个探测文件。跑完可以用 --purge-stale 之外的方式手动删，不影响正式 Release。
#
# 注意：--concurrency 1 是为了测「单连接」速率（决定大文件能不能在合理时间内传完），
# 并发数只是把总时长按倍数压缩，不改变单连接速率。

on:
  workflow_dispatch:
    inputs:
      size_mb:
        description: "探测文件大小（MB）"
        required: false
        default: "40"
        type: string

permissions:
  contents: read

concurrency:
  group: net-probe
  cancel-in-progress: true

jobs:
  probe:
    runs-on: ubuntu-latest
    # 单流 100KB/s 传 40MB 约 7 分钟，留足余量
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        mode: [direct, warp]
    name: probe-${{ matrix.mode }}
    env:
      GITCODE_TOKEN: ${{ secrets.GITCODE_TOKEN }}
    steps:
      - name: Check out scripts
        uses: actions/checkout@v4
        with:
          sparse-checkout: |
            scripts
          sparse-checkout-cone-mode: false

      - name: Egress before
        run: |
          echo "ipv4=$(curl -s -4 --max-time 10 https://api.ipify.org || echo n/a)"
          curl -s --max-time 15 https://www.cloudflare.com/cdn-cgi/trace | grep -E '^(ip|warp|loc)=' || echo "trace n/a"

      # WARP client 模式会建 TUN，公网流量全局走 CF 边缘，node 脚本无需改动。
      # 只用官方 apt 源自己装，不引第三方 action（同 job 里有 GITCODE_TOKEN）。
      - name: Set up WARP
        if: matrix.mode == 'warp'
        run: |
          set -euo pipefail
          CODENAME="$(. /etc/os-release && echo "${VERSION_CODENAME:-jammy}")"
          curl -fsSL https://pkg.cloudflareclient.com/pubkey.gpg \
            | sudo gpg --yes --dearmor --output /usr/share/keyrings/cloudflare-warp-archive-keyring.gpg
          echo "deb [signed-by=/usr/share/keyrings/cloudflare-warp-archive-keyring.gpg] https://pkg.cloudflareclient.com/ ${CODENAME} main" \
            | sudo tee /etc/apt/sources.list.d/cloudflare-client.list >/dev/null
          sudo apt-get update -qq
          sudo apt-get install -y -qq cloudflare-warp
          warp-cli --accept-tos registration new
          warp-cli --accept-tos connect
          sleep 10
          warp-cli --accept-tos status || true

      - name: Egress after
        run: |
          echo "ipv4=$(curl -s -4 --max-time 10 https://api.ipify.org || echo n/a)"
          curl -s --max-time 20 https://www.cloudflare.com/cdn-cgi/trace | grep -E '^(ip|warp|loc)=' || echo "trace n/a"

      - name: Make payload
        run: |
          SZ=${{ inputs.size_mb }}
          head -c $((SZ * 1024 * 1024)) /dev/urandom > "probe-${{ matrix.mode }}.bin"
          ls -lh "probe-${{ matrix.mode }}.bin"

      # --concurrency 1 --no-ip-pick：只测一条连接、系统 DNS，变量最少。
      # --no-download-check：下载校验会额外消耗时间，测速不需要。
      - name: Upload to GitCode (timed)
        run: |
          set -o pipefail
          START=$(date +%s)
          node scripts/publish-to-gitcode.js \
            --tag "net-probe-${{ matrix.mode }}" \
            --name "Net Probe ${{ matrix.mode }}" \
            --target main \
            --file "probe-${{ matrix.mode }}.bin" \
            --force \
            --require-token \
            --concurrency 1 \
            --no-ip-pick \
            --no-download-check 2>&1 | tee upload.log
          END=$(date +%s)
          SEC=$((END - START)); [ "$SEC" -lt 1 ] && SEC=1
          BYTES=$(stat -c%s "probe-${{ matrix.mode }}.bin")
          RATE=$((BYTES / SEC / 1024))
          echo "### probe-${{ matrix.mode }}：${SEC}s，${RATE} KB/s（单流）" | tee -a "$GITHUB_STEP_SUMMARY"
