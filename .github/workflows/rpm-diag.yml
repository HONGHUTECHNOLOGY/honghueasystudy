name: RPM Diagnose 2 (temporary)

# 第二轮：runner 的 rpm 已升到 6.0.1，中文路径单独测试是通过的。
# 这里验证两个嫌疑：① --rpm-compression xzmt 在 rpm 6 下的行为
# ② fpm 1.9.3 生成的 spec 在 rpm 6 下是否还能构建（真实 fpm 跑玩具目录）。

on:
  workflow_dispatch:

jobs:
  diag:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Payload compressor 测试（rpm 6）
        run: |
          for pc in "w2.xzmt" "w9.xz" "w9.zstd" "w2.xz"; do
            W=$(mktemp -d); mkdir -p "$W/SPECS"
            cat > "$W/SPECS/t.spec" <<SPEC
          Name: hh-pc
          Version: 0.0.1
          Release: 1
          Summary: t
          License: MIT
          %define _binary_payload $pc
          %description
          t
          %install
          mkdir -p %{buildroot}/opt/x
          echo hi > %{buildroot}/opt/x/a
          %files
          /opt/x
          /opt/x/a
          SPEC
            out=$(rpmbuild -bb --define "_topdir $W" "$W/SPECS/t.spec" 2>&1); rc=$?
            first_err=$(echo "$out" | grep -iE "error|invalid|unknown|不支持" | head -2 | tr '\n' ' ')
            echo "payload=$pc -> exit=$rc ${first_err}"
          done

      - name: 真实 fpm 复现（玩具目录）
        run: |
          curl -sSL -o /tmp/fpm.7z "https://github.com/electron-userland/electron-builder-binaries/releases/download/fpm-1.9.3-2.3.1-linux-x86_64/fpm-1.9.3-2.3.1-linux-x86_64.7z"
          rm -rf /tmp/fpmx; 7z x -y -o/tmp/fpmx /tmp/fpm.7z >/dev/null
          echo "== 顶层结构 =="; find /tmp/fpmx -maxdepth 2 | head -10
          WRAP=$(find /tmp/fpmx -maxdepth 3 -type f -name 'fpm' ! -path '*/lib/app/bin/*' | head -1)
          echo "WRAP=$WRAP"
          [ -n "$WRAP" ] && chmod +x "$WRAP" && "$WRAP" --version 2>&1 | head -3

          AppDir=/tmp/appdir; rm -rf "$AppDir"; mkdir -p "$AppDir"; echo hi > "$AppDir/some-file.txt"
          run_fpm() {
            echo "===== $1 ====="
            shift
            "$@" 2>&1 | tail -25
            echo "---- 退出码 ${PIPESTATUS[0]} ----"
          }
          [ -n "$WRAP" ] || { echo "没找到 fpm 启动器"; exit 0; }

          run_fpm "B1 中文路径 + xzmt" \
            "$WRAP" -s dir --force -t rpm -d gtk3 --rpm-os linux --rpm-compression xzmt \
            --architecture amd64 --description 'test' --version 1.0.0 --package /tmp/out1.rpm \
            --name hh-smoke --maintainer 'a <a@b.c>' --url https://example.com --vendor 'a <a@b.c>' --license MIT \
            "$AppDir/=/opt/鸿鹄易学"

          run_fpm "B2 中文路径 + 默认压缩" \
            "$WRAP" -s dir --force -t rpm -d gtk3 --rpm-os linux \
            --architecture amd64 --description 'test' --version 1.0.0 --package /tmp/out2.rpm \
            --name hh-smoke --maintainer 'a <a@b.c>' --url https://example.com --vendor 'a <a@b.c>' --license MIT \
            "$AppDir/=/opt/鸿鹄易学"

          run_fpm "B3 ASCII 路径 + xzmt" \
            "$WRAP" -s dir --force -t rpm -d gtk3 --rpm-os linux --rpm-compression xzmt \
            --architecture amd64 --description 'test' --version 1.0.0 --package /tmp/out3.rpm \
            --name hh-smoke --maintainer 'a <a@b.c>' --url https://example.com --vendor 'a <a@b.c>' --license MIT \
            "$AppDir/=/opt/honghueasystudy"

          echo "== 产出 =="; ls -la /tmp/out*.rpm 2>/dev/null || echo "无 rpm 产出"
