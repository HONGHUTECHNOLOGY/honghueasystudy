name: Publish to GitCode

# GitCode 镜像发布：把 GitHub Release 的安装包同步到 GitCode（客户端清单 urls[0]）。
# 上传动作在 GitHub runner 上执行（scripts/publish-to-gitcode.js + GITCODE_TOKEN）；
# 早前用过的 GitCode 原生 Action（.gitcode/workflows/release-publish.yml）已删除，
# 因为 GitCode 托管 runner 缺 node、跨岸直传又卡死，才改为由 GitHub CI 硬传。
#
# 触发方式：
#   - **自动（正常发版路径）**：desktop-build 的 upload-release 跑完后，
#     其 dispatch-gitcode job 立刻派发本 workflow（只带 tag），无需人工介入。
#   - 手动：仅在需要补传/重传镜像时用（脚本幂等，已上传且校验通过的附件自动跳过）。
#
# 附件来源 = GitHub Release（gh release download 白名单），不再依赖 artifact run id，
# 所以补传时只要知道 tag。GitHub Release 是唯一事实源，GitCode 是它的镜像。
#
# 本 workflow 末步自动派发 update-manifest 回写清单 —— 「GitCode 传完了才放用户
# 看到更新」这道门禁的落点就在这：本 workflow 失败，清单就不会被写。
#
# 为什么这么慢也要做：GitHub CI（海外）→ GitCode OBS（国内）单连接 ~100KB/s，
# 只能靠多路并发把 2.7GB 压到 1~2 小时（GitCode 预签名 PUT 不支持分片，没法更快）。
# 与 desktop-build 拆成独立 workflow：打包失败不会连带镜像发布；镜像失败也只需
# 重跑本 workflow。
#
# 前置：仓库 Secrets 需配置 GITCODE_TOKEN（GitCode 个人访问令牌）。

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag（如 v5.3.0），GitHub 与 GitCode 一致"
        required: true
        type: string

permissions:
  # 下载 GitHub Release 附件（gh release download）
  contents: read
  # 末步 gh workflow run update-manifest.yml 需要 actions: write
  # （GITHUB_TOKEN 默认无此权限，缺失时 dispatch 步骤 403）
  actions: write

concurrency:
  group: publish-gitcode
  # 不同 tag 的发布不该互相取消；同一时刻只跑一个，后来的排队
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    # 2.7GB 慢速上传 + 最多 3 轮重试，留足余量（GitHub job 上限 6 小时）
    timeout-minutes: 330
    env:
      GITCODE_TOKEN: ${{ secrets.GITCODE_TOKEN }}
    steps:
      # 发布要跑仓库里的 scripts/publish-to-gitcode.js（仅内置模块，无需装依赖）
      - name: Check out scripts
        uses: actions/checkout@v4
        with:
          sparse-checkout: |
            scripts
          sparse-checkout-cone-mode: false

      # GitHub Release 是唯一事实源：安装包、更新包、校验文件、扩展、说明正文都在这里。
      # 附件名与清单里的文件名一致（honghueasystudy-<ver>-setup-<os>-<arch>.<ext>），
      # 所以直接把附件名当 GitCode 附件名即可，客户端 URL 无需改写。
      # 下载全部附件（含 assets-manifest.json 等小文件），后面用白名单筛掉不该镜像的。
      - name: Download release assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          TAG_NAME: ${{ inputs.tag }}
        run: |
          gh release download "$TAG_NAME" --dir artifacts --clobber
          ls -lh artifacts/

      # 安装包排最前：它们才是客户端真正下载的文件，失败要尽早暴露。
      # --concurrency 8：单连接跨境 ~100KB/s，8 路把 2.6GB 压到 1~2 小时。
      # --upload-ips 4：对 OBS 端点解析出的多条 A 记录做 TCP 握手计时，取最快 4 个
      #   分给并发任务（DNS 只给一条时自动跳过）——线路绕路时能明显改善。
      # 脚本幂等：Release 已存在的同名附件自动跳过，重跑只补缺的。
      - name: Upload to GitCode Release
        run: |
          TAG_NAME=${{ inputs.tag }}
          FILES=()
          for f in artifacts/*.exe artifacts/*.dmg artifacts/*.AppImage artifacts/*.deb artifacts/*.rpm \
                   artifacts/app-*.zip artifacts/*.zip.sha256 artifacts/extension.zip; do
            if [ -f "$f" ]; then FILES+=(--file "$f"); fi
          done
          if [ ${#FILES[@]} -eq 0 ]; then
            echo "没有可同步的附件（安装包 / 更新包 / 扩展均缺失）"
            exit 1
          fi
          # 说明正文由 desktop-build 生成并传上 Release；老版本没这个附件时退回自动正文
          NOTES_ARGS=()
          if [ -f artifacts/release-notes.md ]; then
            NOTES_ARGS=(--notes-file artifacts/release-notes.md)
          else
            echo "::warning::该 Release 没有 release-notes.md，GitCode 侧将使用默认正文"
          fi
          ls -lh artifacts/
          node scripts/publish-to-gitcode.js \
            --tag "$TAG_NAME" \
            --name "$TAG_NAME" \
            "${NOTES_ARGS[@]}" \
            --concurrency 8 \
            --upload-ips 4 \
            --purge-stale \
            --require-token \
            "${FILES[@]}"

      # workflow_dispatch 是 GITHUB_TOKEN 防递归规则的豁免事件，可以直接派发。
      # 此时 GitCode 附件已就位，update-manifest 的探链才能全绿 —— 任一源缺包就拒绝
      # 写清单（fail-closed 是刻意门禁：清单发出去等于承诺这个版本可下载）。
      - name: Dispatch update manifest
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          TAG_NAME: ${{ inputs.tag }}
        run: |
          gh workflow run update-manifest.yml --ref main -f tag="$TAG_NAME"
          echo "已派发 update-manifest（回写更新清单并触发 CF 重建）"
